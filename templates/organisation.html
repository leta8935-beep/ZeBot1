<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Inter,sans-serif}
body{width:1100px;height:650px;background:linear-gradient(135deg,#090e1a,#16113b 55%,#3b1768);color:#fff;display:flex;align-items:center;justify-content:center}
.card{width:1010px;height:570px;padding:38px;border-radius:38px;background:rgba(255,255,255,.065);border:1px solid rgba(255,255,255,.12);box-shadow:0 35px 90px rgba(0,0,0,.45);position:relative;overflow:hidden}
.card:before,.card:after{content:"";position:absolute;border-radius:50%;filter:blur(70px);pointer-events:none}
.card:before{width:360px;height:360px;right:-110px;top:-120px;background:rgba(124,58,237,.35)}
.card:after{width:280px;height:280px;left:-100px;bottom:-160px;background:rgba(37,99,235,.22)}
.top{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:flex-start}
.brand{display:flex;gap:24px;align-items:center}
.logo{width:128px;height:128px;border-radius:30px;object-fit:cover;background:#172033;border:1px solid rgba(255,255,255,.15);box-shadow:0 15px 35px rgba(0,0,0,.35)}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:2px;color:#a5b4fc;font-weight:800;margin-bottom:9px}
.title{font-size:38px;font-weight:800;line-height:1.05;max-width:610px}
.sphere{font-size:16px;color:#aab4c8;margin-top:10px}
.level{padding:10px 17px;border-radius:20px;background:linear-gradient(135deg,#8b5cf6,#6d28d9);font-weight:800;box-shadow:0 8px 25px rgba(124,58,237,.35)}
.type{display:inline-block;margin-top:14px;padding:7px 13px;border-radius:14px;background:rgba(255,255,255,.08);color:#ddd6fe;font-size:12px;font-weight:700}
.stats{position:relative;z-index:1;display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:32px}
.stat{min-height:112px;border-radius:20px;padding:18px;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.08)}
.label{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#94a3b8;font-weight:800}
.value{font-size:25px;font-weight:800;margin-top:10px;white-space:nowrap}
.unit{font-size:12px;color:#a78bfa}
.bottom{position:relative;z-index:1;margin-top:26px;display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:14px}
.info{border-radius:20px;padding:18px 20px;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.07)}
.small{font-size:11px;color:#94a3b8;text-transform:uppercase;letter-spacing:1px;font-weight:800}
.big{font-size:18px;font-weight:700;margin-top:7px}
.progress{height:8px;border-radius:8px;background:rgba(255,255,255,.08);margin-top:13px;overflow:hidden}
.bar{height:100%;width:64%;border-radius:8px;background:linear-gradient(90deg,#8b5cf6,#a78bfa)}
</style>
</head>
<body>
<div class="card">
  <div class="top">
    <div class="brand">
      <img class="logo" id="logo" src="" alt="">
      <div>
        <div class="eyebrow">Организация · управление</div>
        <div class="title" id="org_name">Название</div>
        <div class="sphere" id="sphere">Сфера деятельности</div>
        <div class="type" id="org_type">Бизнес</div>
      </div>
    </div>
    <div class="level" id="level_badge">LVL 1</div>
  </div>

  <div class="stats">
    <div class="stat">
      <div class="label">Доход / час</div>
      <div class="value" id="income">0 <span class="unit">RUB</span></div>
    </div>
    <div class="stat">
      <div class="label">Накоплено</div>
      <div class="value" id="acc">0 <span class="unit">RUB</span></div>
    </div>
    <div class="stat">
      <div class="label">Бюджет</div>
      <div class="value" id="balance">0 <span class="unit">RUB</span></div>
    </div>
    <div class="stat">
      <div class="label">Участники</div>
      <div class="value" id="members">0</div>
    </div>
  </div>

  <div class="bottom">
    <div class="info">
      <div class="small">Владелец</div>
      <div class="big" id="owner">Игрок</div>
    </div>
    <div class="info">
      <div class="small">Следующее улучшение</div>
      <div class="big" id="upgrade_cost">0 RUB</div>
    </div>
    <div class="info">
      <div class="small">Развитие</div>
      <div class="progress"><div class="bar" id="bar"></div></div>
      <div class="big" id="level_text">Уровень 1</div>
    </div>
  </div>
</div>
<script>
window.renderData=(data)=>{
  document.getElementById("logo").src=data.logo_url||"https://i.imgur.com/vHq5K9u.png";
  document.getElementById("org_name").innerText=data.name||"Без названия";
  document.getElementById("sphere").innerText=data.sphere||"Не указана";
  document.getElementById("org_type").innerText=data.org_type||"Бизнес";
  document.getElementById("income").innerHTML=Number(data.income||0).toLocaleString("ru-RU")+' <span class="unit">RUB</span>';
  document.getElementById("acc").innerHTML=Number(data.acc||0).toLocaleString("ru-RU")+' <span class="unit">RUB</span>';
  document.getElementById("balance").innerHTML=Number(data.balance||0).toLocaleString("ru-RU")+' <span class="unit">RUB</span>';
  document.getElementById("members").innerText=Number(data.members||0).toLocaleString("ru-RU");
  document.getElementById("owner").innerText=data.owner||"Не указан";
  document.getElementById("upgrade_cost").innerText=Number(data.upgrade_cost||0).toLocaleString("ru-RU")+" RUB";
  document.getElementById("level_badge").innerText="LVL "+data.level;
  document.getElementById("level_text").innerText="Уровень "+data.level;
  const progress=Math.max(8,Math.min(100,(Number(data.level)%10)*10||100));
  document.getElementById("bar").style.width=progress+"%";
};
</script>
</body>
</html>

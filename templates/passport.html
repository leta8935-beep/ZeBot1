<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  /* Задаем точные размеры твоего фона, чтобы не было обрезки и белых полей */
  body { width: 1064px; height: 1478px; background: transparent; overflow: hidden; }
  svg { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<svg id="passport-svg" xmlns="http://www.w3.org/2000/svg" width="1064" height="1478" viewBox="0 0 1064 1478">
  
  <!-- 1. ФОН ПАСПОРТА -->
  <!-- Убедись, что файл на GitHub называется passport_bg.png (или поменяй на .jpg) -->
  <image href="https://raw.githubusercontent.com/leta8935-beep/ZeBot/main/assets/passport_bg.png" x="0" y="0" width="1064" height="1478" preserveAspectRatio="xMidYMid slice" />

  <!-- Стили для текста (шрифт без засечек, как на реальных паспортах) -->
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&amp;family=Roboto:wght@400;700&amp;display=swap');
    
    .header { font-family: 'Roboto', sans-serif; font-size: 28px; font-weight: 700; fill: #111; }
    .label { font-family: 'Roboto', sans-serif; font-size: 16px; font-weight: 700; fill: #333; }
    .value { font-family: 'Roboto', sans-serif; font-size: 20px; font-weight: 400; fill: #000; }
    .mrz { font-family: 'Roboto Mono', monospace; font-size: 28px; font-weight: 700; fill: #111; letter-spacing: 2px; }
  </style>

  <!-- 2. ФОТО ПОЛЬЗОВАТЕЛЯ -->
  <!-- Координаты подобраны под центр твоего фона -->
  <image id="photo" x="80" y="600" width="240" height="320" preserveAspectRatio="xMidYMid slice" href="" />

  <!-- 3. ТЕКСТОВЫЕ ДАННЫЕ -->
  
  <!-- Заголовок (Страна) -->
  <text class="header" x="380" y="230" id="country_title">РОССИЙСКАЯ ФЕДЕРАЦИЯ</text>
  <text class="header" x="380" y="270" id="country_title_en">RUSSIAN FEDERATION</text>

  <!-- Левая колонка -->
  <text class="label" x="380" y="350">Фамилия / Surname</text>
  <text class="value" x="380" y="380" id="surname">ИВАНОВ</text>

  <text class="label" x="380" y="430">Имя / Name</text>
  <text class="value" x="380" y="460" id="name">ИВАН</text>

  <text class="label" x="380" y="510">Отчество / Patronymic</text>
  <text class="value" x="380" y="540" id="patronymic">ИВАНОВИЧ</text>

  <text class="label" x="380" y="590">Дата рождения / Date of birth</text>
  <text class="value" x="380" y="620" id="dob">01.01.1990</text>

  <text class="label" x="380" y="670">Место рождения / Place of birth</text>
  <text class="value" x="380" y="700" id="pob">Г. МОСКВА</text>

  <text class="label" x="380" y="750">Гражданство / Nationality</text>
  <text class="value" x="380" y="780" id="nationality">РОССИЙСКАЯ ФЕДЕРАЦИЯ</text>

  <text class="label" x="380" y="830">Орган выдачи / Authority</text>
  <text class="value" x="380" y="860">МИГРАЦИОННАЯ СЛУЖБА</text>

  <text class="label" x="380" y="910">Код государства / State code</text>
  <text class="value" x="380" y="940" id="state_code_val">RUS</text>

  <text class="label" x="380" y="990">Номер паспорта / Passport No.</text>
  <text class="value" x="380" y="1020" id="passport_number">0000 000000</text>

  <text class="label" x="380" y="1070">Учетная запись / Discord ID</text>
  <text class="value" x="380" y="1100" id="discord_id">123456789012345678</text>

  <!-- 4. MRZ (Машиночитаемая зона внизу) -->
  <text class="mrz" x="80" y="1350" id="mrz1">P&lt;RUSIVANOV&lt;&lt;IVAN&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;</text>
  <text class="mrz" x="80" y="1390" id="mrz2">0000000000RUS9001010M3001010&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;02</text>
</svg>

<script>
window.renderData = (data) => {
  const setText = (id, val) => {
    const el = document.getElementById(id);
    if (el) el.textContent = val;
  };

  // Подстановка текста
  setText('country_title', data.state_name);
  setText('country_title_en', 'RUSSIAN FEDERATION');
  setText('state_code_val', data.state_code);
  setText('passport_number', data.passport_number);
  setText('surname', data.surname.toUpperCase());
  setText('name', data.name.toUpperCase());
  setText('patronymic', data.patronymic.toUpperCase());
  setText('dob', data.dob);
  setText('pob', data.pob.toUpperCase());
  setText('nationality', data.state_name);
  setText('discord_id', data.discord_id);

  // Фото (строго по ссылке)
  const photoEl = document.getElementById('photo');
  if (photoEl && data.photo_url) {
    photoEl.setAttribute('href', data.photo_url);
  }

  // Генерация MRZ (машиночитаемая зона)
  const code = (data.state_code || 'RUS').toUpperCase();
  const surname = data.surname.toUpperCase().replace(/[^A-Z]/g, '').padEnd(20, '<');
  const name = data.name.toUpperCase().replace(/[^A-Z]/g, '').padEnd(20, '<');
  
  const mrz1 = `P<${code}${surname}<<${name}${'<'.repeat(30)}`.slice(0, 44);
  const mrz2 = `${data.passport_number.replace(/\s/g, '')}${code}${data.dob.replace(/\./g, '')}M${'<'.repeat(20)}`.slice(0, 44).padEnd(44, '<');
  
  setText('mrz1', mrz1);
  setText('mrz2', mrz2);
};
</script>
</body>
</html>
